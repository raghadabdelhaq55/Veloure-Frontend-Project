<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="./output.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Contact</title>
  </head>

  <body class="bg-background text-text font-Inter">
    <header
      class="relative min-h-[80vh] "
    >
      <div id="siteNav" class="site-nav">
        <div class="container mx-auto flex items-center px-6">
          <div class="logo">
            <a href="#" class="flex items-center gap-3 lg:gap-4">
              <img
                src="../assets/v-logo.png"
                alt="Veloure Logo"
                class="w-8 h-8 lg:w-10 lg:h-10"
              />

              <div class="flex flex-col">
                <span
                  class="font-display text-xl lg:text-2xl tracking-[0.25em] text-text"
                >
                  VELOURE
                </span>

                <span
                  class="text-[8px] lg:text-[9px] tracking-[0.25em] uppercase text-muted lg:pr-8"
                >
                  Automotive Atelier
                </span>
              </div>
            </a>
          </div>
          <nav class="hidden lg:block">
            <ul class="flex items-center gap-6">
              <li><a href="#" class="nav-link">Home</a></li>
              <li><a href="#" class="nav-link">Fleet</a></li>
              <li><a href="#" class="nav-link">Experience</a></li>
              <li><a href="#" class="nav-link">About</a></li>
              <li><a href="#" class="nav-link nav-link-active">Contact</a></li>
            </ul>
          </nav>
          <div class="flex items-center lg:items-end ml-auto">
            <button class="ml-4 lg:ml-12">
              <img
                src="../assets/bright-icon.png"
                alt=""
                class="w-10 h-10 lg:w-12 lg:h-12"
              />
            </button>

            <button class="ml-2 lg:hidden">
              <img src="../assets/v-menu.png" alt="Menu" class="w-10 h-10" />
            </button>

            <button
              class="hidden lg:block ml-4 text-line tracking-[0.22em] uppercase text-[11px] py-4 px-7 border border-line hover:bg-tint hover:scale-105 transition-transform duration-300"
            >
              Reserve Now
            </button>
          </div>
        </div>
      </div>

      <section
        class="hero container mx-auto flex flex-col text-text mt-48 lg:mt-56 px-6 xl:px-0"
      >
        <p class="text-[10px] sm:text-[11px] text-line uppercase pb-6 lg:pb-8">
          <span class="hidden sm:inline"> ———— </span>
          <span class="tracking-[0.2em] sm:tracking-[0.35em] sm:ml-4"
            >Concierge</span
          >
        </p>

        <h1
          class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-display leading-[1.05] pb-8 lg:pb-10"
        >
          Speak to a person
        </h1>

        <p class="max-w-2xl text-[15px] leading-[1.9] text-muted">
          Every enquiry is answered by the specialist who will prepare your
          motorcar — within three hours, in four languages, at any hour of the
          day.
        </p>
      </section>
    </header>
  </body>
</html>
